<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" style="width: 400px; margin:auto ; border:2px solid black; padding: 20px; border-radius: 10px; background-color: rgb(0, 208, 255);">
        <h1 style="text-shadow:1px 1px  black;">Register Scholarship</h1>
       
        <label for="">FirstName</label> <br>
        <input type="text" placeholder="Enter FirstName" name="firstname" > <br>

        <label for="">LastName</label> <br>
        <input type="text" placeholder="Enter LastName" name="lastname" > <br>

        <label for="">Gender</label> <br>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female <br>

        <label for="">Email</label> <br>
        <input type="email" placeholder="Enter Email" name="email" > <br>

        <label for="">Password</label> <br>
        <input type="password" placeholder="Enter Password" name="password" > <br>

        <label for="">Confirm Password</label> <br>
        <input type="password" placeholder="Confirm Password" name="confirmpassword" > <br>

        <label for="">Phone</label> <br>
        <input type="tel" placeholder="Enter Phone" name="phone" > <br>

        <input type="checkbox" name="remember"> 
        <label for="">Do you want to remember me?</label> <br>
        
        <input type="submit" value="Register">

        



    </form>
</body>
</html>
