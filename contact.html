<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url("https://i.pinimg.com/1200x/f5/26/15/f52615f3e8b12f6d1e416966ac4d29e5.jpg");
            background-repeat: no-repeat;
            background-size: cover;
        }
        .form{
            width: 350px;
            margin:  autopadding: 60px;
            background-color: rgb(255, 255, 255);
            border:1px solid gray;
            border-radius: 10px;
        }
        .title-contact{
            color:rgb(101, 101, 29);
            text-align: center;
        }
        .sub-title{
            color:aliceblue;
            text-align: center;
        }
        .label-input{
            color:rgb(17, 17, 17);
            font-size: 20px;
        }
        .input-form{
            width: 98%;
            boder:none;
            border-radius: 25px;
            font-style: italic;
            font-size: 20px;
            background-color: rgb(255, 255, 255);
            box-shadow: 0px 0px 5px 0px rgb(0, 0, 0);
            padding:10px;
            color:aliceblue;
        }
    </style>
</head>
<body>
    <form  action="" class="form">
        <h1 class="title-contact"> Contact for more</h1
        <p class="sub-title"><i> Please contact for more</i><br><br>
         Can contact if you have something to me.</p>
         <label class="label-input"> First Name</label>
         <input  class="input-form" type="text" name="name" id=""><br><br>
         <label class="label-input"> Last name</label>
         <br>
         <label class="label-input"> Email</label>


    </form>
</body>
</html>
